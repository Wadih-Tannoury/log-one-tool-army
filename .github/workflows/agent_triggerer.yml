name: Log One Tool Army

on:
  workflow_dispatch:
    inputs:
      submit_zendesk_responses:
        description: "Submit final_response as public Zendesk ticket replies"
        required: true
        type: boolean
        default: true
      persist_generated_documents:
        description: "Commit generated/downloaded PDF documents into this repository"
        required: false
        type: boolean
        default: false
      assign_unhandled_tickets_to_group:
        description: "Assign unresolved tickets to the second-level logistics group"
        required: false
        type: boolean
        default: true
      escalation_group_name:
        description: "Zendesk group that receives unresolved tickets"
        required: false
        type: string
        default: "LOG II lvl"

jobs:
  process_requests:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Python block-buffers stdout when it is a pipe, which is what the
      # Actions runner gives it. Without this the progress lines sit in an
      # 8 KB buffer and the step looks frozen for minutes at a time.
      PYTHONUNBUFFERED: "1"
      PROJECT_ID: tlg-business-intelligence-prd
      BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
      # Separate service account for tlg-wlfs-prd, read by
      # til_bigquery_client() for the prd_shipmentStatus lookup and by
      # response_data_extractor for the prd_invoiceUpdate invoice fallback
      # (GET_FULL_ORDER 404). Optional: a missing secret only skips those
      # last-resort steps.
      TIL_BIGQUERY_CREDS: ${{ secrets.TIL_BIGQUERY_CREDS }}
      ZENDESK_API_CREDENTIALS: ${{ secrets.ZENDESK_API_CREDENTIALS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      # Anthropic key, used for two things: the address translation in
      # response_data_extractor.py, and the last-resort LLM fallback in
      # intent_detection.py when every Gemini model in the chain has failed.
      # Both read it from the environment, and a job-level entry is what
      # makes a repository secret visible to the steps -- creating the
      # secret alone does not expose it to anything.
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GET_FULL_ORDER_API_CREDENTIALS: ${{ secrets.GET_FULL_ORDER_API_CREDENTIALS }}
      GENERATED_DOCUMENTS_DIR: generated_documents
      DOCUMENT_PUBLIC_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}
      LOG_HISTORY_TABLE: tlg-business-intelligence-prd.til.log_one_tool_army_logs_history
      SUBMIT_ZENDESK_RESPONSES: ${{ inputs.submit_zendesk_responses }}
      ZENDESK_STATUS_AFTER_REPLY: solved
      PERSIST_GENERATED_DOCUMENTS: ${{ inputs.persist_generated_documents }}
      # Tickets the workflow could not resolve (no data found, no action taken)
      # are handed to this Zendesk group instead of being left unattended.
      ZENDESK_ESCALATION_GROUP_NAME: ${{ inputs.escalation_group_name }}
      ASSIGN_UNHANDLED_TICKETS_TO_GROUP: ${{ inputs.assign_unhandled_tickets_to_group }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tesseract OCR
        # Used only to read order references out of scanned PDF attachments.
        # The pipeline degrades gracefully to "no order reference found" when
        # this engine is unavailable.
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            db-dtypes \
            pyarrow \
            google-auth \
            google-cloud-bigquery \
            google-cloud-bigquery-storage \
            google-genai \
            pymupdf \
            Pillow \
            reportlab \
            pytesseract

      - name: Initialize Workflow Run
        run: python -c "import uuid; print(f'WORKFLOW_RUN_ID={uuid.uuid4()}')" >> "$GITHUB_ENV"

      - name: Verify Environment
        run: |
          echo "Workflow started"
          echo "Project: $PROJECT_ID"
          echo "History table: $LOG_HISTORY_TABLE"
          echo "Workflow run id: $WORKFLOW_RUN_ID"
          echo "Zendesk response submission: $SUBMIT_ZENDESK_RESPONSES"
          echo "Zendesk status after automatic reply: $ZENDESK_STATUS_AFTER_REPLY"
          echo "Persist generated documents: $PERSIST_GENERATED_DOCUMENTS"
          echo "Assign unresolved tickets to group: $ASSIGN_UNHANDLED_TICKETS_TO_GROUP"
          echo "Escalation group: $ZENDESK_ESCALATION_GROUP_NAME"
          if [ -n "$CLAUDE_API_KEY" ]; then
            echo "Anthropic fallback: key present"
          else
            echo "Anthropic fallback: NO KEY - Gemini-only, address translation disabled"
          fi

      - name: Fetch Tickets
        run: python ticket_fetcher.py

      - name: Run Regex Engine
        run: python regex_engine.py

      - name: Verify Regex Outputs
        run: |
          ls -lah output
          test -f output/regex_matches.jsonl.gz
          test -f output/unmatched_tickets.jsonl.gz

      - name: Run Intent Detection
        run: python intent_detection.py

      - name: Extract API-Backed Response Data and Documents
        run: python response_data_extractor.py

      - name: Persist Generated PDF Documents in Repository
        if: ${{ inputs.persist_generated_documents }}
        run: |
          if [ ! -d generated_documents ] || ! find generated_documents -type f -name '*.pdf' | grep -q .; then
            echo "No generated PDF documents to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated_documents

          if git diff --cached --quiet; then
            echo "Generated PDF documents are already tracked and unchanged."
            exit 0
          fi

          git commit -m "Add generated customs documents for $WORKFLOW_RUN_ID"
          git push

      - name: Generate Responses, Log to BigQuery, and Optionally Reply in Zendesk
        run: python response_generator.py

      - name: Verify Local Handoffs
        run: |
          ls -lah output
          test -f output/request_intent_results.jsonl.gz

      - name: Upload Generated PDF Documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-customs-documents
          path: generated_documents
          if-no-files-found: ignore

      - name: Workflow Complete
        run: |
          echo "Pipeline completed successfully"
